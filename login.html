<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Pawvia</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <main class="login-container">


        <div class="logo">
            🐾 Pawvia
        </div>


        <h1>
            Login / Sign Up
        </h1>


        <input
            type="text"
            placeholder="Email or Phone Number"
        >


        <input
            type="password"
            placeholder="Password"
        >


        <button class="submit-button">

            Login

        </button>


        <p>
            New to Pawvia?
        </p>


        <button class="secondary-button">

            Create Account

        </button>


        <button
            class="back-button"
            onclick="goHome()"
        >

            ← Back

        </button>


    </main>


</body>

</html>
